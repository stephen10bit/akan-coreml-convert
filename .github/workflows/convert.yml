name: Convert Akan model to Core ML

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install whisperkittools
        run: |
          git clone https://github.com/argmaxinc/whisperkittools.git
          cd whisperkittools
          pip install -e .

      - name: Convert the model
        run: |
          cd whisperkittools
          whisperkit-generate-model \
            --model-version GiftMark/akan-whisper-model \
            --output-dir "$GITHUB_WORKSPACE/out"

      - name: Zip the result
        run: |
          cd "$GITHUB_WORKSPACE"
          ls -R out | head -50
          zip -r akan-coreml.zip out

      - uses: actions/upload-artifact@v4
        with:
          name: akan-coreml
          path: akan-coreml.zip
